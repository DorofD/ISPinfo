name: ispinfo

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ispinfo
    ports:
      - "8080:5000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/database.db
    volumes:
      - data:/app/data
    restart: unless-stopped
